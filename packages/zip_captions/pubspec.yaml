name: zip_captions
description: Zip Captions — personal real-time speech-to-text captioning app.
publish_to: none
version: 0.1.0

resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  file_selector: ^1.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0
  google_fonts: ^6.1.0
  local_auth: ^2.3.0
  logging: ^1.3.0
  path_provider: ^2.1.5
  riverpod_annotation: ^2.6.1
  share_plus: ^11.0.0
  shared_preferences: ^2.5.0
  # supabase_flutter: Supabase.initialize + client, wired identically to
  # zip_broadcast for Phase 3 auth reuse readiness (Unit 2, FR-1.1). No
  # sign-in UI in Phase 2 — this app never calls AuthNotifier.signIn.
  # Already pre-approved (technical-specification.md Section 6).
  supabase_flutter: ^2.17.2
  zip_core:
    path: ../zip_core

dev_dependencies:
  build_runner: ^2.4.15
  drift: ^2.20.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.3
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
