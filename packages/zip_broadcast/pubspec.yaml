name: zip_broadcast
description: Zip Broadcast — professional captioning app for broadcasters and educators.
publish_to: none
version: 0.1.0

resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  clock: ^1.1.0
  desktop_multi_window: ^0.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.4
  # go_router: declarative routing with nested shell routes (ZbAppShell) and
  # deep-link support. flutter Navigator 2 alone lacks type-safe, nested-shell
  # API needed for the rail/drawer adaptive layout (FD C1). Approved via PR #15.
  go_router: ^14.0.0
  # google_fonts: required to render CaptionFont.notoSans / .openDyslexic at
  # runtime without bundling large font assets. No built-in Flutter equivalent.
  # Approved via PR #15.
  google_fonts: ^6.1.0
  intl: any
  json_annotation: ^4.9.0
  logging: ^1.3.0
  obs_websocket: ^5.0.0
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.5.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  uuid: ^4.5.1
  zip_core:
    path: ../zip_core

dev_dependencies:
  build_runner: ^2.4.15
  fake_async: ^1.3.2
  flutter_test:
    sdk: flutter
  freezed: ^2.5.8
  http: ^1.2.2
  json_serializable: ^6.9.4
  mocktail: ^1.0.4
  riverpod_generator: ^2.6.3
  very_good_analysis: ^10.0.0

flutter:
  generate: true
  uses-material-design: true
