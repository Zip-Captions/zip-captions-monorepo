# Coturn config for the local dev stack (Unit 4: Coturn Infrastructure).
#
# Derived from Spike 2.3's validated spike config
# (spike/2.3-coturn-alongside-supabase:spikes/phase2/coturn/turnserver.conf),
# with two changes: the relay port range is widened (NFR Requirements Q1,
# fixing the spike's port-exhaustion finding under a 10-client burst) and
# static-auth-secret is NOT set here — it's supplied via the coturn
# service's `command:` CLI-flag override in docker-compose.yml, since
# Coturn's config loader has no env-var substitution of its own
# (confirmed against the official docs). See
# aidlc-docs/construction/coturn-infrastructure/infrastructure-design/infrastructure-design.md.

# --- Listening ---
# CodeRabbit (PR #27): with network_mode: host, Coturn otherwise auto-binds
# its control port to every local interface it finds, not just loopback --
# unlike every other zip_supabase service, which binds 127.0.0.1 only via
# its compose `ports:` mapping. listening-ip restricts the STUN/TURN
# control port to loopback too, matching that convention. Verified via
# /proc/net/udp before/after: the control port moved from every local
# interface to 127.0.0.1 only, a loopback STUN request still succeeds, and
# a full allocate/refresh/channel-bind test still runs correctly through
# this loopback-only control port -- its channel-bind is correctly
# rejected with 403 Forbidden IP, because that test targets a loopback
# peer address, which denied-peer-ip below still (correctly) refuses as a
# relay target, unaffected by this change.
#
# relay-ip is deliberately left unset. Unlike listening-ip, it's the
# address Coturn's relay sockets bind to when exchanging media with the
# actual two peers being relayed between -- the entire point of a TURN
# server. Restricting it to loopback would make a relay socket literally
# unreachable by any real (non-loopback) peer, breaking the feature this
# service exists for; denied-peer-ip below already excludes loopback/
# private ranges as relay *targets*, which is the actual SSRF-relevant
# control surface here.
listening-ip=127.0.0.1
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

# --- TURN REST API credential mechanism (shared-secret / time-limited) ---
# Matches TurnCredentialService's fixed shape (username, credential,
# expiresAt, urls) from phase2-component-methods.md. use-auth-secret mode
# issues a username of "<unix-ts>" and a credential of
# base64(HMAC-SHA1(secret, username)), valid until the embedded timestamp.
# static-auth-secret itself is passed via the command-line override, not
# set here (see header note).
use-auth-secret

# --- Realm ---
realm=zipcaptions.local

# --- Payload-free logging (SR-03) ---
# no-stdout-log + explicit log file; verbose is OFF so relayed packet
# contents are never logged, only connection/session metadata. Validated
# payload-free by Spike 2.3 across every allocate/refresh/channel-bind/relay
# test run against this exact logging configuration.
log-file=/var/log/turnserver/turnserver.log
no-stdout-log
simple-log
# Explicitly NOT setting -v/--verbose or -V/--Verbose: those would log
# per-packet details.

# --- Private-range relay denial (SR-03) ---
# Coturn relays data between peers; it must never be tricked into relaying
# to an internal/private address (SSRF-adjacent risk). Deny RFC 1918 +
# loopback + link-local + CGNAT + documentation/benchmark ranges.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# --- Metrics (SR-03) ---
# Coturn's built-in Prometheus exporter — internal-only, not published to
# the host (NFR Requirements Q6).
prometheus

# --- Misc hardening ---
fingerprint
no-multicast-peers
no-cli
stale-nonce=600
