_format_version: "2.1"
_transform: true

###
### Consumers / Credentials
###
consumers:
  - username: DASHBOARD
  - username: anon
    keyauth_credentials:
      - key: ${ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SERVICE_ROLE_KEY}

###
### Access Control List
###
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

###
### API Routes
###

services:
  ## PostgREST — REST API
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - admin

  ## PostgREST — resolve_broadcast_id (rate-limited; split out of rest-v1 so
  ## the limit applies to exactly this RPC, not all REST/RPC traffic —
  ## Unit 3 Infrastructure Design, NFR Requirements Q1)
  - name: rest-v1-resolve-broadcast-id
    url: http://rest:3000/rpc/resolve_broadcast_id
    routes:
      - name: rest-v1-resolve-broadcast-id-route
        strip_path: true
        paths:
          - /rest/v1/rpc/resolve_broadcast_id
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - admin
      - name: rate-limiting
        config:
          limit_by: ip
          minute: 30
          second: 2
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  ## PostgREST — submit_join_request (rate-limited; split out of rest-v1 so
  ## the limit applies to exactly this RPC, not all REST/RPC traffic --
  ## Unit 3.1, PR #29 review: an anonymous caller could otherwise flood
  ## broadcast_join_requests with no per-IP limit at all. Same shape as
  ## resolve_broadcast_id's existing rate limit below.)
  - name: rest-v1-submit-join-request
    url: http://rest:3000/rpc/submit_join_request
    routes:
      - name: rest-v1-submit-join-request-route
        strip_path: true
        paths:
          - /rest/v1/rpc/submit_join_request
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - admin
      - name: rate-limiting
        config:
          limit_by: ip
          minute: 30
          second: 2
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  ## PostgREST — GraphQL
  - name: graphql-v1
    url: http://rest:3000/rpc/graphql
    routes:
      - name: graphql-v1-all
        strip_path: true
        paths:
          - /graphql/v1
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - admin

  ## GoTrue — Auth
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  ## Realtime — WebSockets
  - name: realtime-v1
    url: http://realtime-dev.supabase-realtime:4000/socket/
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors

  ## Storage — File storage
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

  ## Edge Functions — Deno runtime
  - name: functions-v1
    url: http://functions:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors

  ## Postgres Meta — Database metadata (used by Studio)
  - name: meta
    url: http://meta:8080/
    routes:
      - name: meta-all
        strip_path: true
        paths:
          - /pg/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
