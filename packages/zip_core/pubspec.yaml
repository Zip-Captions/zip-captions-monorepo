name: zip_core
description: Shared Dart library for Zip Captions — STT abstraction, providers, models, and settings.
publish_to: none
version: 0.1.0

resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  # app_links: already a transitive dependency via supabase_flutter (which
  # subscribes to it internally for the automatic OAuth-callback session
  # exchange). Declared directly here too because SupabaseAuthService also
  # runs its own parallel subscription to observe OAuth failures
  # supabase_flutter's internal handler doesn't surface (see
  # supabase_auth_service.dart's doc comment; SR-01 Section 3, approved
  # 2026-09-28).
  app_links: ^7.0.0
  archive: ^3.6.1
  crypto: ^3.0.6
  dio: ^5.7.0
  drift: ^2.20.0
  drift_flutter: ^0.2.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  # flutter_secure_storage: backs SecureDesktopLocalStorage's session-token
  # storage override (Unit 2, S-15/SR-01 §4). Already pre-approved
  # (docs/04-technical-specification.md Section 6).
  flutter_secure_storage: ^9.2.2
  # flutter_webrtc: already an approved dependency
  # (docs/04-technical-specification.md Section 6) — Unit 5 is the first to
  # actually declare it. Pinned to a specific version, not an open range,
  # matching this project's convention for infrastructure-adjacent
  # dependencies (e.g. supabase_flutter). Re-verified current on pub.dev at
  # Code Generation (2026-10-08) — newer than the version checked at NFR
  # Requirements (2026-10-05).
  flutter_webrtc: ^1.6.2+hotfix.4
  freezed_annotation: ^2.4.4
  google_fonts: ^6.1.0
  json_annotation: ^4.9.0
  logging: ^1.3.0
  meta: ^1.15.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  record: ^5.1.2
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.5.0
  sherpa_onnx: ^1.10.31
  speech_to_text: ^7.0.0
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.0
  # supabase_flutter: broadcaster auth backend (Unit 2, S-15/SR-01, FR-1.1).
  # Already pre-approved (docs/04-technical-specification.md Section 6).
  supabase_flutter: ^2.17.2
  uuid: ^4.5.1
  wakelock_plus: ^1.2.8

dev_dependencies:
  build_runner: ^2.4.15
  clock: ^1.1.2
  drift_dev: ^2.20.0
  fake_async: ^1.3.2
  flutter_test:
    sdk: flutter
  freezed: ^2.5.8
  http_mock_adapter: ^0.6.1
  json_serializable: ^6.9.4
  mocktail: ^1.0.4
  permission_handler_platform_interface: ^4.2.0
  plugin_platform_interface: ^2.1.8
  riverpod_generator: ^2.6.3
  very_good_analysis: ^10.0.0
