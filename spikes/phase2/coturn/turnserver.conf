# Coturn config for Spike 2.3 (Coturn Alongside Supabase).
#
# THROWAWAY spike config, never merged into packages/zip_supabase — the
# real config is Unit 4 Infrastructure Design's job, informed by what this
# spike finds. See spikes/phase2/coturn/README.md for the runbook.

# --- Listening ---
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=49252

# --- TURN REST API credential mechanism (shared-secret / time-limited) ---
# Matches TurnCredentialService's fixed shape (username, credential,
# expiresAt, urls) from phase2-component-methods.md — coturn's
# use-auth-secret mode issues a username of "<unix-ts>[:<user-id>]" and a
# credential of base64(HMAC-SHA1(secret, username)), valid until the
# embedded timestamp, no database/admin API needed.
use-auth-secret
static-auth-secret=spike-2-3-throwaway-shared-secret-do-not-reuse

# --- Realm ---
realm=zipcaptions.local

# --- Payload-free logging (SR-03 input) ---
# no-stdout-log + explicit log file; verbose is OFF so relayed packet
# contents are never logged, only connection/session metadata.
log-file=/var/log/turnserver/turnserver.log
no-stdout-log
simple-log
# Explicitly NOT setting -v/--verbose or -V/--Verbose: those would log
# per-packet details. Confirm in the report this is actually payload-free.

# --- Private-range relay denial (SR-03 input) ---
# Coturn relays data between peers; it must never be tricked into relaying
# to an internal/private address (SSRF-adjacent risk). Deny RFC 1918 +
# loopback + link-local as relay targets.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# --- Metrics (SR-03 input) ---
# Coturn's built-in Prometheus exporter.
prometheus

# --- Misc hardening ---
fingerprint
no-multicast-peers
no-cli
stale-nonce=600
